<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Syllabi — College of Engineering | University of Hafr Al Batin</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --brick:#8B2C1A;
  --brick-deep:#5A1C10;
  --sand:#F1C68F;
  --gold:#C98A3E;
  --ink:#241C19;
  --muted:#6E605A;
  --line:#E7DDD1;
  --paper:#FFFFFF;
  --wash:#FBF5EE;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font:16px/1.55 "Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}
a{color:var(--brick)}
.wrap{max-width:960px;margin:0 auto;padding:0 22px}

/* ---------- header ---------- */
header.site{border-bottom:3px solid var(--brick)}
.masthead{display:flex;align-items:center;gap:20px;padding:18px 0 16px}
.masthead img{height:56px;width:auto;display:block}
.masthead .titles{border-left:1px solid var(--line);padding-left:20px}
.masthead h1{
  font:600 19px/1.2 Georgia,"Times New Roman",serif;
  margin:0;color:var(--brick-deep);letter-spacing:.1px;
}
.masthead p{margin:3px 0 0;font-size:13.5px;color:var(--muted)}
@media (max-width:620px){
  .masthead{gap:14px;padding:14px 0}
  .masthead img{height:42px}
  .masthead .titles{padding-left:14px}
  .masthead h1{font-size:16px}
}

/* ---------- breadcrumb ---------- */
nav.crumbs{background:var(--wash);border-bottom:1px solid var(--line);font-size:13.5px}
nav.crumbs .wrap{display:flex;align-items:center;gap:8px;min-height:42px;flex-wrap:wrap}
nav.crumbs button{
  background:none;border:0;padding:2px 0;font:inherit;color:var(--brick);
  cursor:pointer;border-bottom:1px solid transparent;
}
nav.crumbs button:hover{border-bottom-color:var(--brick)}
nav.crumbs .sep{color:var(--gold)}
nav.crumbs .here{color:var(--muted)}

main{padding:34px 0 60px;min-height:52vh}
.lede{max-width:62ch;color:var(--muted);margin:0 0 26px;font-size:15px}
h2.section{
  font:600 24px/1.25 Georgia,"Times New Roman",serif;
  margin:0 0 6px;color:var(--brick-deep);
}

/* ---------- departments ---------- */
.depts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:820px){.depts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:440px){.depts{grid-template-columns:1fr}}
.dept{
  text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--brick);
  padding:18px 16px 16px;display:block;
}
.dept:hover{background:var(--wash);border-color:var(--sand);border-top-color:var(--brick)}
.dept:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.dept .code{font:700 28px/1 Georgia,serif;color:var(--brick)}
.dept .name{margin-top:8px;font-size:15px;font-weight:600}
.dept .count{margin-top:10px;font-size:12.5px;color:var(--muted)}

/* ---------- course list ---------- */
.courses{border-top:1px solid var(--line);margin-top:18px}
.course{
  width:100%;text-align:left;font:inherit;color:inherit;background:none;cursor:pointer;
  border:0;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding:15px 6px;
}
.course:hover{background:var(--wash)}
.course:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.course .code{
  flex:0 0 96px;font:600 14px/1 "Segoe UI",Arial,sans-serif;color:var(--brick);
  border:1px solid var(--sand);background:#FDF6EC;padding:6px 8px;text-align:center;
}
.course .title{flex:1;font:400 16px/1.35 Georgia,serif}
.course .type{flex:0 0 auto;font-size:12.5px;color:var(--muted)}
.course .type.lab{color:var(--gold);font-weight:600}
.course .go{flex:0 0 auto;color:var(--gold);font-size:18px;line-height:1}
@media (max-width:560px){
  .course{flex-wrap:wrap;gap:8px 12px}
  .course .code{flex:0 0 auto}
  .course .title{flex:1 1 100%;order:3}
  .course .go{margin-left:auto}
}

/* ---------- course detail ---------- */
.detail{border:1px solid var(--line);border-top:4px solid var(--brick);padding:24px;margin-top:6px}
.detail .code{font:600 14px/1 "Segoe UI",Arial,sans-serif;color:var(--brick)}
.detail h3{font:600 26px/1.25 Georgia,serif;margin:8px 0 2px}
.detail .meta{color:var(--muted);font-size:14px;margin:0 0 22px}
.picks{display:flex;gap:14px;flex-wrap:wrap}
.pick{
  flex:1 1 230px;display:block;text-decoration:none;cursor:pointer;text-align:left;
  font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);padding:16px 18px;
}
.pick:hover{background:var(--wash);border-color:var(--gold)}
.pick:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pick .k{font-weight:600;font-size:16px;color:var(--brick-deep)}
.pick .d{font-size:13px;color:var(--muted);margin-top:4px}
.pick[aria-disabled="true"]{opacity:.5;pointer-events:none}
.notice{margin-top:20px;font-size:13.5px;color:var(--muted);border-left:3px solid var(--sand);padding-left:12px}

/* ---------- html viewer ---------- */
.viewbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.viewbar h3{font:600 20px/1.3 Georgia,serif;margin:0}
.viewbar a{font-size:13.5px}
iframe.syllabus{width:100%;height:74vh;border:1px solid var(--line);background:#fff}

.empty{border:1px dashed var(--sand);background:var(--wash);padding:26px;color:var(--muted);font-size:15px}

/* ---------- footer ---------- */
footer.site{border-top:1px solid var(--line);background:var(--wash)}
footer.site .wrap{padding:22px;text-align:center}
footer.site .credit{font:600 14px/1.5 Georgia,serif;color:var(--brick-deep)}
footer.site .credit span{display:block;font-weight:400;color:var(--muted);font-size:13px}
footer.site .org{margin-top:10px;font-size:12.5px;color:var(--muted)}

@media (prefers-reduced-motion:no-preference){
  .dept,.course,.pick{transition:background-color .15s ease,border-color .15s ease}
}
</style>
</head>
<body>

<header class="site">
  <div class="wrap masthead">
    <img src="assets/uhb-logo.png" alt="University of Hafr Al Batin">
    <div class="titles">
      <h1>College of Engineering — Course Syllabi</h1>
      <p>Browse by department, then open a syllabus as a web page or download the PDF.</p>
    </div>
  </div>
</header>

<nav class="crumbs" aria-label="Breadcrumb">
  <div class="wrap" id="crumbs"></div>
</nav>

<main class="wrap" id="main"></main>

<footer class="site">
  <div class="wrap">
    <div class="credit">Idea and Design: ME Chairman<span>Prof. IbnShamsah</span></div>
    <div class="org">College of Engineering · University of Hafr Al Batin</div>
  </div>
</footer>

<script>
/* ----------------------------------------------------------------
   Course data lives in data/courses.xlsx — one sheet per department
   (ME, EE, CE, CHE). Columns: No | Code | Title | Type | Folder |
   HTML | PDF.  Edit the workbook and push; this page picks it up.
   The list below is only a fallback if the workbook can't be read
   (for example when opening index.html straight from disk).
------------------------------------------------------------------*/
const DEPTS = [
  {key:"ME",  name:"Mechanical Engineering"},
  {key:"EE",  name:"Electrical Engineering"},
  {key:"CE",  name:"Civil Engineering"},
  {key:"CHE", name:"Chemical Engineering"}
];

const FALLBACK = {
  ME:[
    {No:1, Code:"MCEN 4410", Title:"Manufacturing Processes",            Type:"Lecture",    Folder:"MCEN4410-Lec", HTML:"", PDF:""},
    {No:2, Code:"ME 210",    Title:"Mechanical Engineering Drawing",     Type:"Laboratory", Folder:"ME210-Lab",    HTML:"syllabus.html", PDF:"syllabus.pdf"},
    {No:3, Code:"ME 311",    Title:"Fluid Mechanics",                    Type:"Lecture",    Folder:"ME311-Lec",    HTML:"syllabus.html", PDF:"syllabus.pdf"},
    {No:4, Code:"ME 413",    Title:"System Dynamics and Control",        Type:"Lecture",    Folder:"ME413-Lec",    HTML:"", PDF:""},
    {No:5, Code:"ME 413",    Title:"System Dynamics and Control",        Type:"Laboratory", Folder:"ME413-Lab",    HTML:"", PDF:""},
    {No:6, Code:"ME 472",    Title:"Corrosion Engineering",              Type:"Lecture",    Folder:"ME472-Lec",    HTML:"", PDF:""},
    {No:7, Code:"ME 499",    Title:"Fundamentals of Energy Efficiency",  Type:"Lecture",    Folder:"ME499-Lec",    HTML:"", PDF:""}
  ],
  EE:[], CE:[], CHE:[]
};

let DATA = FALLBACK;
const main = document.getElementById("main");
const crumbBar = document.getElementById("crumbs");

/* ---------- load the workbook ---------- */
async function loadCourses(){
  try{
    const res = await fetch("data/courses.xlsx", {cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const wb = XLSX.read(await res.arrayBuffer(), {type:"array"});
    const out = {};
    DEPTS.forEach(d=>{
      const sheet = wb.Sheets[d.key];
      out[d.key] = sheet ? XLSX.utils.sheet_to_json(sheet, {defval:""}) : [];
    });
    if(Object.values(out).some(rows=>rows.length)) DATA = out;
  }catch(e){
    console.warn("Using built-in course list; data/courses.xlsx not read.", e);
  }
}

/* ---------- helpers ---------- */
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rowsOf = k => (DATA[k]||[]).filter(r => r.Code);
const deptName = k => (DEPTS.find(d=>d.key===k)||{}).name || k;
const fileURL = (dept,row,f) => "data/"+dept+"/"+row.Folder+"/"+f;

function crumbs(parts){
  crumbBar.innerHTML = parts.map((p,i)=>{
    const tail = i < parts.length-1 ? ' <span class="sep">/</span> ' : '';
    return (p.go ? `<button data-nav="${p.go}">${esc(p.label)}</button>`
                 : `<span class="here">${esc(p.label)}</span>`) + tail;
  }).join("");
}

/* ---------- views ---------- */
function viewHome(){
  crumbs([{label:"Departments"}]);
  main.innerHTML = `
    <h2 class="section">Departments</h2>
    <p class="lede">Choose a department to see its courses. Each course offers its syllabus as a web page or a downloadable PDF.</p>
    <div class="depts">
      ${DEPTS.map(d=>{
        const n = rowsOf(d.key).length;
        return `<button class="dept" data-dept="${d.key}">
                  <div class="code">${d.key}</div>
                  <div class="name">${esc(d.name)}</div>
                  <div class="count">${n ? n+" course"+(n>1?"s":"") : "Courses coming soon"}</div>
                </button>`;
      }).join("")}
    </div>`;
  location.hash = "";
}

function viewDept(dept){
  const rows = rowsOf(dept);
  crumbs([{label:"Departments", go:"home"},{label:deptName(dept)}]);
  main.innerHTML = `
    <h2 class="section">${esc(deptName(dept))}</h2>
    <p class="lede">${rows.length ? "Select a course to open its syllabus." : ""}</p>
    ${rows.length ? `<div class="courses">${rows.map((r,i)=>`
      <button class="course" data-dept="${dept}" data-i="${i}">
        <span class="code">${esc(r.Code)}</span>
        <span class="title">${esc(r.Title)}</span>
        <span class="type ${/lab/i.test(r.Type)?"lab":""}">${esc(r.Type)}</span>
        <span class="go" aria-hidden="true">›</span>
      </button>`).join("")}</div>`
    : `<div class="empty">Course syllabi for ${esc(deptName(dept))} have not been added yet.</div>`}`;
  location.hash = dept;
}

function viewCourse(dept, i){
  const r = rowsOf(dept)[i]; if(!r) return viewDept(dept);
  const hasH = !!r.HTML, hasP = !!r.PDF;
  crumbs([{label:"Departments", go:"home"},{label:deptName(dept), go:"dept:"+dept},{label:r.Code+" "+r.Type}]);
  main.innerHTML = `
    <div class="detail">
      <div class="code">${esc(r.Code)} · ${esc(r.Type)}</div>
      <h3>${esc(r.Title)}</h3>
      <p class="meta">${esc(deptName(dept))} · file location: data/${esc(dept)}/${esc(r.Folder)}/</p>
      <div class="picks">
        <button class="pick" data-html="${dept}|${i}" ${hasH?"":'aria-disabled="true"'}>
          <div class="k">Read the syllabus here</div>
          <div class="d">${hasH ? "Opens as a web page inside this site" : "Web version not uploaded yet"}</div>
        </button>
        <a class="pick" ${hasP?`href="${fileURL(dept,r,r.PDF)}" download`:'aria-disabled="true" href="#"'}>
          <div class="k">Download the PDF</div>
          <div class="d">${hasP ? "Saves a printable copy to your device" : "PDF not uploaded yet"}</div>
        </a>
      </div>
      ${(!hasH && !hasP) ? `<p class="notice">No syllabus files have been uploaded for this course yet.</p>` : ``}
    </div>`;
  location.hash = dept+"/"+i;
}

function viewHTML(dept, i){
  const r = rowsOf(dept)[i]; if(!r || !r.HTML) return viewCourse(dept,i);
  const url = fileURL(dept,r,r.HTML);
  crumbs([{label:"Departments", go:"home"},{label:deptName(dept), go:"dept:"+dept},
          {label:r.Code+" "+r.Type, go:"course:"+dept+":"+i},{label:"Syllabus"}]);
  main.innerHTML = `
    <div class="viewbar">
      <h3>${esc(r.Code)} — ${esc(r.Title)} (${esc(r.Type)})</h3>
      <a href="${url}" target="_blank" rel="noopener">Open in a new tab</a>
    </div>
    <iframe class="syllabus" src="${url}" title="Syllabus for ${esc(r.Code)}"></iframe>`;
  location.hash = dept+"/"+i+"/html";
}

/* ---------- routing ---------- */
function go(token){
  if(token==="home") return viewHome();
  if(token.startsWith("dept:")) return viewDept(token.slice(5));
  if(token.startsWith("course:")){ const [,d,i]=token.split(":"); return viewCourse(d,+i); }
}
function fromHash(){
  const p = decodeURIComponent(location.hash.replace(/^#/,"")).split("/").filter(Boolean);
  if(!p.length) return viewHome();
  if(!DEPTS.some(d=>d.key===p[0])) return viewHome();
  if(p.length===1) return viewDept(p[0]);
  if(p[2]==="html") return viewHTML(p[0], +p[1]);
  return viewCourse(p[0], +p[1]);
}

document.addEventListener("click", e=>{
  const nav = e.target.closest("[data-nav]");   if(nav)  return go(nav.dataset.nav);
  const dep = e.target.closest(".dept");        if(dep)  return viewDept(dep.dataset.dept);
  const crs = e.target.closest(".course");      if(crs)  return viewCourse(crs.dataset.dept, +crs.dataset.i);
  const htm = e.target.closest("[data-html]");  if(htm){ const [d,i]=htm.dataset.html.split("|"); return viewHTML(d,+i); }
});
window.addEventListener("hashchange", fromHash);

loadCourses().then(fromHash);
</script>
</body>
</html>
